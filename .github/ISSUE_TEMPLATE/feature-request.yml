name: 機能・改善提案
description: 管理者の個人用記録。外部からのIssueは受け付けていません。
title: '[Feature] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: '管理者の個人用記録に使うフォームです。外部からのIssueは受け付けていません。


      脆弱性の報告は [SECURITY.md](https://github.com/roflsunriz/the-tools/blob/main/SECURITY.md) に従い、公開Issueへ詳細を書かないでください。'
- type: textarea
  id: problem
  attributes:
    label: 解決したい問題
    description: 誰がどの場面で困っていますか。既存の方法で足りない点を説明してください。
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: 提案
    description: 希望する動作・内容と、改善を確認できる例を記載してください。
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: 代替案と互換性
    description: 検討した別の方法、既存の使い方・保存データ・対応環境への影響を記載してください。不明ならその旨を記載してください。
  validations:
    required: true
- type: textarea
  id: additional
  attributes:
    label: 補足
    description: 対象の版、参考資料、関連Issue、共有可能な画像など。
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: 公開情報の確認
    description: 非公開リポジトリの場合も、秘密値を含めずアクセス可能な人に共有できる内容だけを記載してください。
    options:
    - label: APIキー、Cookie、認証情報、個人情報、非公開の脆弱性詳細を含めないことを確認しました。
      required: true
  validations:
    required: true
